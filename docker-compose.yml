services:
  # --- DATABASE ---
  db:
    image: postgres:15
    container_name: resume-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: resumedb
    ports:
      - "5432:5432"

  # --- AI SERVICE (PYTHON) ---
  ai-service:
    build: ./python-folder-kau # Ganti dengan nama folder python kau
    container_name: ai-service
    ports:
      - "8000:8000"
    depends_on:
      - db

  # --- BACKEND (JAVA) ---
  backend:
    build: ./java-folder-kau # Ganti dengan nama folder java kau
    container_name: java-backend
    ports:
      - "8080:8080"
    environment:
      # PENTING: Guna nama service 'db' dan 'ai-service'
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/resumedb
      AI_SERVICE_URL: http://ai-service:8000/classify
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_started